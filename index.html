<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);height:100%;color-scheme:dark}
:root[data-theme="light"],:root[data-theme="dark"]{color-scheme:dark}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;background:#060A14}
body{margin:0;height:100%;color:#E6EEFF;background:radial-gradient(900px 520px at 0% -10%,rgba(34,211,238,.20),transparent 60%),radial-gradient(800px 520px at 110% 20%,rgba(129,140,248,.22),transparent 60%),radial-gradient(700px 500px at 50% 120%,rgba(244,114,182,.10),transparent 60%),#060A14;background-attachment:fixed;-webkit-text-size-adjust:100%;font-family:'Inter',system-ui,sans-serif}
#app{height:100%}
#app > div{width:100% !important;max-width:560px;height:100% !important;margin:0 auto;background:transparent !important}
#app button{-webkit-tap-highlight-color:transparent;transition:transform .12s ease,box-shadow .2s ease,background .2s ease}
#app button:active{transform:scale(.97)}
#app [style*="rgba(255,255,255,0.05)"],#app [style*="rgba(129,140,248,0.14)"]{-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#app div[style*="border-radius: 14px"][style*="rgba(255,255,255,0.05)"]{box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 10px 30px rgba(0,0,0,.25)}
.topbar{background:rgba(6,10,20,.6);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
nav{background:rgba(8,12,24,.78) !important;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid rgba(103,232,249,.18) !important}
.brand,.grad{background:linear-gradient(90deg,#67E8F9,#A78BFA);-webkit-background-clip:text;background-clip:text;color:transparent}
input{color:#E6EEFF !important}
input::placeholder{color:#64748B}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1) opacity(.7)}
input:focus,button:focus-visible{outline:2px solid #67E8F9 !important;outline-offset:1px;box-shadow:0 0 0 4px rgba(34,211,238,.18)}
h1,h2{letter-spacing:-0.02em}
.holo{overflow:hidden}
.scan{position:absolute;left:34%;width:32%;height:2px;top:0;background:linear-gradient(90deg,transparent,#67E8F9,transparent);box-shadow:0 0 12px #22D3EE;opacity:.7;animation:scan 3.6s ease-in-out infinite;z-index:1;pointer-events:none}
@keyframes scan{0%{top:2%}50%{top:96%}100%{top:2%}}
@media (prefers-reduced-motion: reduce){.scan{animation:none;display:none}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: rgba(255,255,255,0.04); color: #E6EEFF; font-family: 'Inter', system-ui, sans-serif; overflow: hidden;">

<sc-if value="{{ termsWait }}" hint-placeholder-val="{{ false }}">
<div role="status" style="flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #AEB9D4; font-size: 14px;">
<svg width="44" height="44" viewBox="0 0 32 32" fill="none" aria-hidden="true"><defs><linearGradient id="lgw" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"></stop><stop offset="1" stop-color="#A78BFA"></stop></linearGradient></defs><path d="M5 22 L16 11 L27 22" stroke="url(#lgw)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M9 28 L16 21 L23 28" stroke="url(#lgw)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"></path><circle cx="16" cy="5" r="2.6" fill="#67E8F9"></circle></svg>
<div>Loading your data…</div>
</div>
</sc-if>
<sc-if value="{{ showTerms }}" hint-placeholder-val="{{ false }}">
<div style="flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column;">
<div class="topbar" style="flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid rgba(148,163,209,0.18);">
<svg width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true"><defs><linearGradient id="lg9" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"></stop><stop offset="1" stop-color="#A78BFA"></stop></linearGradient></defs><path d="M5 22 L16 11 L27 22" stroke="url(#lg9)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M9 28 L16 21 L23 28" stroke="url(#lg9)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"></path><circle cx="16" cy="5" r="2.6" fill="#67E8F9"></circle></svg>
<div style="display: flex; flex-direction: column; gap: 2px;">
<div style="font-family: 'Sora', 'Inter', system-ui, sans-serif; font-size: 19px; font-weight: 700;">{{ termsTitle }}</div>
<div style="font-size: 13px; color: #AEB9D4;">Medical &amp; legal disclaimer · Updated September 20, 2026</div>
</div>
</div>
<div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 18px;">
<sc-for list="{{ terms }}" as="t" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 7px;">
<div style="font-size: 13px; font-weight: 700; letter-spacing: 0.1em; color: #67E8F9;">{{ t.h }}</div>
<sc-for list="{{ t.lines }}" as="ln" hint-placeholder-count="2">
<div style="font-size: 13.5px; line-height: 1.6; color: #B4C0DA;">{{ ln }}</div>
</sc-for>
</div>
</sc-for>
<div style="height: 4px;"></div>
</div>
<div style="flex-shrink: 0; padding: 14px 20px 18px; border-top: 1px solid rgba(148,163,209,0.18); background: rgba(6,10,20,0.55); display: flex; flex-direction: column; gap: 10px;">
<sc-if value="{{ termsGate }}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{ toggleTick }}" style="display: flex; align-items: flex-start; gap: 12px; text-align: left; padding: 12px 14px; border: 1px solid {{ tickBorder }}; border-radius: 12px; background: rgba(255,255,255,0.05); color: #E6EEFF; font-size: 13px; line-height: 1.5; font-weight: 500; font-family: inherit; cursor: pointer;">
<span style="flex-shrink: 0; width: 22px; height: 22px; border-radius: 6px; border: 2px solid {{ tickBorder }}; background: {{ tickBg }}; color: #04111F; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center;">{{ tickMark }}</span>
<span>I have read this. I understand Ascendose does not give medical advice, and I will use it only to track what my prescriber has given me.</span>
</button>
<sc-if value="{{ hasTermsErr }}" hint-placeholder-val="{{ false }}"><div role="alert" style="font-size: 13px; font-weight: 600; color: #FCA5A5;">{{ termsErr }}</div></sc-if>
<button type="button" onClick="{{ acceptTerms }}" style="min-height: 50px; border: none; border-radius: 14px; background: {{ acceptBg }}; color: {{ acceptFg }}; font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer;">Agree and open Ascendose</button>
<div style="font-size: 13px; line-height: 1.5; color: #AEB9D4;">If you do not agree, close this page. You can read this again any time under More.</div>
</sc-if>
<sc-if value="{{ termsReview }}" hint-placeholder-val="{{ false }}">
<div style="font-size: 13px; font-weight: 600; color: #34D399;">{{ termsSub }}</div>
<button type="button" onClick="{{ closeTerms }}" style="min-height: 48px; border: none; border-radius: 14px; background: linear-gradient(135deg, #22D3EE, #818CF8); color: #04111F; font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer;">Close</button>
</sc-if>
</div>
</div>
</sc-if>

<sc-if value="{{ showApp }}" hint-placeholder-val="{{ true }}">
<div class="topbar" style="height: 60px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid rgba(148,163,209,0.18);">
<div style="display: flex; align-items: center; gap: 10px;">
<svg width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true"><defs><linearGradient id="lg1" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"></stop><stop offset="1" stop-color="#A78BFA"></stop></linearGradient></defs><path d="M5 22 L16 11 L27 22" stroke="url(#lg1)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M9 28 L16 21 L23 28" stroke="url(#lg1)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"></path><circle cx="16" cy="5" r="2.6" fill="#67E8F9"></circle></svg>
<span class="brand" style="font-family: 'Sora', 'Inter', system-ui, sans-serif; font-size: 22px; font-weight: 700; letter-spacing: -0.02em;">Ascendose</span>
</div>
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; color: #AEB9D4; border: 1px solid rgba(148,163,209,0.3); border-radius: 999px; padding: 4px 10px;">BETA</span>

<div style="font-size: 12px; line-height: 1.5; color: #AEB9D4;">In step 1, pick Save Image in the share sheet so the icon lands in Photos. Menu names can differ slightly between iOS versions.</div>

  renderVals() {
    var self = this, s = this.state;
    var syr = function (units, label) {
      var u = units > 0 ? units : 0, fillPx = Math.min(u, 100) * 3;
      var tk = [], mn = [];
      for (var i = 0; i <= 10; i++) tk.push({ left: 16 + i * 30 - 1, tx: 16 + i * 30, label: String(i * 10) });
      for (var j = 2; j < 100; j += 2) if (j % 10) mn.push({ left: 16 + j * 3 });
      var lab = label || (u > 0 ? (Math.round(Math.min(u, 100) * 10) / 10) + (u > 100 ? '+ units' : ' units') : 'enter values');
      return { fillPx: fillPx, plungerL: 16 + fillPx - 2, calloutL: Math.max(45, Math.min(290, 16 + fillPx)), label: lab, ticks: tk, minor: mn, caption: 'units (U-100 insulin syringe, 1 mL)' };
    };
    var syrML = function (ml, forceMax) {
      var v = ml > 0 ? ml : 0, max = forceMax || (v > 1 ? 3 : 1), major = max === 1 ? 0.1 : 0.5, minorStep = max === 1 ? 0.02 : 0.1;
      var px = function (x) { return 16 + x / max * 300; }, fillPx = Math.min(v, max) / max * 300, tk = [], mn = [];
